<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAC CA Performance Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
        }

        header {
            background: #003366;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 { font-size: 20px; }
        header span { font-size: 13px; color: #f0a500; }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #f0a500;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover { color: white; }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid #003366;
        }

        .stat-card h3 {
            font-size: 36px;
            color: #003366;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #666;
            font-size: 14px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            color: #003366;
            font-size: 20px;
        }

        .refresh-btn {
            background: #003366;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .refresh-btn:hover { background: #f0a500; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #003366;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        tr:hover td { background: #f9f9f9; }

        .utm-cell {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #003366;
            font-size: 12px;
            display: inline-block;
            vertical-align: middle;
        }

        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .delete-btn {
            background: #ffebee;
            color: #c62828;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover { background: #f44336; color: white; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .copy-btn {
            background: #e3f2fd;
            color: #1565c0;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 5px;
        }

        .copy-btn:hover { background: #1565c0; color: white; }
    </style>
</head>
<body>

<header>
    <h1>🎓 Industry Academia Community</h1>
    <div class="nav-links">
        <a href="/">📝 Register CA</a>
        <a href="/dashboard.html">📊 Dashboard</a>
    </div>
</header>

<div class="container">

    <!-- Stats Cards -->
    <div class="stats-row">
        <div class="stat-card">
            <h3 id="totalCAs">-</h3>
            <p>Total Community Ambassadors</p>
        </div>
        <div class="stat-card">
            <h3 id="totalColleges">-</h3>
            <p>Colleges Represented</p>
        </div>
        <div class="stat-card">
            <h3 id="totalStates">-</h3>
            <p>States Covered</p>
        </div>
    </div>

    <!-- CA Table -->
    <div class="table-container">
        <div class="table-header">
            <h2>📋 Community Ambassadors List</h2>
            <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>
        </div>

        <div id="tableContent">
            <div class="loading">Loading data...</div>
        </div>
    </div>
</div>

<script>
    async function loadDashboard() {
        try {
            const response = await fetch('http://localhost:8080/api/dashboard');
            const data = await response.json();

            const cas = data.caList;
            const total = data.totalCAs;

            // Update stats
            document.getElementById('totalCAs').textContent = total;

            const uniqueColleges = new Set(cas.map(ca => ca.collegeFullName)).size;
            const uniqueStates = new Set(cas.map(ca => ca.stateRegion)).size;

            document.getElementById('totalColleges').textContent = uniqueColleges;
            document.getElementById('totalStates').textContent = uniqueStates;

            // Build table
            if (cas.length === 0) {
                document.getElementById('tableContent').innerHTML =
                    '<div class="empty">No Community Ambassadors registered yet.</div>';
                return;
            }

            let tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>College</th>
                            <th>City</th>
                            <th>UTM Link</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            cas.forEach((ca, index) => {
                tableHtml += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${ca.firstName} ${ca.lastName}</strong></td>
                        <td>${ca.email}</td>
                        <td>${ca.phoneNumber}</td>
                        <td>${ca.collegeFullName}</td>
                        <td>${ca.city || '-'}</td>
                        <td>
                            <span class="utm-cell" title="${ca.utmLink}">${ca.utmLink}</span>
                            <button class="copy-btn" onclick="copyUTM('${ca.utmLink}')">Copy</button>
                        </td>
                        <td><span class="badge">✅ Active</span></td>
                        <td>
                            <button class="delete-btn" onclick="deleteCA(${ca.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });

            tableHtml += '</tbody></table>';
            document.getElementById('tableContent').innerHTML = tableHtml;

        } catch (error) {
            document.getElementById('tableContent').innerHTML =
                '<div class="empty">❌ Error loading data. Make sure server is running.</div>';
        }
    }

    async function deleteCA(id) {
        if (!confirm('Are you sure you want to delete this CA?')) return;
        try {
            await fetch(`http://localhost:8080/api/cas/${id}`, { method: 'DELETE' });
            loadDashboard();
        } catch (error) {
            alert('Error deleting CA!');
        }
    }

    function copyUTM(link) {
        navigator.clipboard.writeText(link);
        alert('UTM Link copied to clipboard!');
    }

    // Load on page open
    loadDashboard();
</script>

</body>
</html>
